# SYSTEM CONFIGURATION

model:
  path: "models/phenobench_cropweed_seg_yolo11s_960.pt"
  imgsz: 960
  conf_threshold: 0.15          # Low threshold to feed uncertainty logic
  tracker_type: "bytetrack.yaml"

memory:
  window_size: 5                 # Frames for temporal uncertainty smoothing
  min_stable_frames: 3           # Frame count before a plant is marked as stable

decision:
  entropy_threshold: 0.3         # Max Shannon Entropy allowed before blocking action
  action_zone_ratio: 0.5         # Lower 50% of the screen is the active "Safe Zone"

io:
  input_video: "smooth_panning_field.mp4"
  output_video: "advanced_agricultural_engine.mp4"
  metrics_output_csv: "run_metrics.csv"
  max_frames: 50                # Set to -1 to process the entire video

# Classes Definition (Name and BGR Color for OpenCV visualization)
classes:
  0:
    name: "Crop"
    color: [144, 238, 144]     # Green (BGR)
  1:
    name: "Weed"
    color: [122, 122, 244]      # Red (BGR)